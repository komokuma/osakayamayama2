<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오사카 여행 노선도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#f3f1ec;--surface:#fff;--ink:#1d2327;--sub:#6b7378;--line:#cfd3d1;--route:#0a8f7a;--bus:#e8442f;--done:#9aa3a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181a;--surface:#1f2528;--ink:#eef1ef;--sub:#97a0a3;--line:#394246;--route:#2fc5ab;--bus:#ff6a52;--done:#667073;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181a;--surface:#1f2528;--ink:#eef1ef;--sub:#97a0a3;--line:#394246;--route:#2fc5ab;--bus:#ff6a52;--done:#667073;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
body{max-width:520px;margin:0 auto;padding:0 0 90px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:12px 16px 8px}
.ttl{font-size:13px;color:var(--sub)}
.status{margin-top:6px;background:var(--surface);border-radius:14px;padding:12px 14px;border-left:5px solid var(--bus)}
.status b{font-size:17px;display:block}.status span{font-size:13px;color:var(--sub)}
.tl{position:relative;margin:18px 16px 0}
.rail,.fill{position:absolute;left:62px;width:6px;margin-left:-3px;border-radius:3px;top:0}
.rail{bottom:0;background:var(--line)}
.fill{background:var(--route);height:0;transition:height 1.2s ease}
.stop{position:relative;display:grid;grid-template-columns:50px 24px 1fr;column-gap:10px;padding-bottom:18px;cursor:pointer}
.time{font-size:15px;font-weight:700;text-align:right;padding-top:2px;font-variant-numeric:tabular-nums}
.dot{width:24px;height:24px;border-radius:50%;background:var(--surface);border:5px solid var(--route);justify-self:center;z-index:1}
.card{background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
.card h3{font-size:16px;font-weight:700}
.card p{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.4}
.stop.past .dot{border-color:var(--done);background:var(--done)}
.stop.past h3,.stop.past .time{color:var(--done);text-decoration:line-through}
.stop.here .dot{border-color:var(--bus)}
.stop.here .card{outline:2px solid var(--bus)}
.bus{position:absolute;left:62px;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:12px;background:var(--bus);color:#fff;display:grid;place-items:center;font-size:21px;z-index:3;transition:top 1.2s ease;box-shadow:0 3px 10px rgba(0,0,0,.28)}
.bus.hide{display:none}
.sim{position:fixed;left:0;right:0;bottom:0;background:var(--surface);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);max-width:520px;margin:0 auto;z-index:6}
.sim .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
.sim button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:5px 10px;font-family:inherit;font-size:13px}
.sim input{width:100%;margin-top:8px;display:none}.sim.on input{display:block}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.bd.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:82%;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .tm{font-size:13px;color:var(--bus);font-weight:700}
.sheet h2{font-size:20px;margin:4px 0 12px}
.sheet ul{padding-left:18px}.sheet li{font-size:15px;line-height:1.6;margin-bottom:8px}
.sheet li.warn{color:var(--bus);list-style:none;margin-left:-18px}
.sheet button{margin-top:10px;width:100%;border:0;border-radius:12px;padding:13px;background:var(--ink);color:var(--bg);font-size:15px;font-family:inherit}
.go{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:12px;background:var(--route);color:#fff;font-size:15px;font-weight:700;margin-top:10px}.go.alt{background:none;color:var(--ink);border:1px solid var(--line);font-weight:400}.status .go{display:inline-block;padding:8px 12px;font-size:13px;margin-top:10px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tab{flex:1;border:1px solid var(--line);background:none;color:var(--sub);border-radius:999px;padding:8px;font:14px inherit}.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.info div{display:flex;gap:10px;font-size:14px;line-height:1.5;margin-bottom:6px}.info b{flex:0 0 62px;color:var(--sub);font-weight:600}
.leg{margin:-4px 0 16px 94px;padding:8px 12px;border-radius:12px;background:none;border:1px dashed var(--route);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;color:var(--ink);line-height:1.4}
.leg i{font-style:normal;color:var(--route);font-weight:700}
.tip{font-size:12.5px;color:var(--sub);line-height:1.45;margin:6px 0 0}
.sheet ol{padding-left:20px}
[hidden]{display:none!important}
.top{display:flex;justify-content:space-between;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:13px inherit}
.hero{position:relative;height:360px;overflow:hidden;border-radius:0 0 30px 30px;background:#1c2a55}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,14,40,.45),transparent 38%,transparent 55%,rgba(10,14,40,.6))}
.logo{position:absolute;z-index:2;top:calc(18px + env(safe-area-inset-top,0px));left:18px;display:flex;align-items:center;gap:10px;color:#fff}
.logo .lg{width:42px;height:42px;border-radius:12px;background:var(--bus);display:grid;place-items:center;font-size:23px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.logo b{display:block;font-size:20px;letter-spacing:.14em}.logo small{font-size:11px;opacity:.85;letter-spacing:.2em}
.ht{position:absolute;z-index:2;left:20px;right:20px;bottom:22px;color:#fff}
.ht h1{font-size:30px;line-height:1.2}.ht p{margin-top:6px;font-size:14px;opacity:.9}
.menu{padding:18px 16px 60px;display:flex;flex-direction:column;gap:12px}
.big{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:700 17px inherit;text-align:left}
.big small{display:block;font-size:13px;font-weight:400;opacity:.9;margin-top:3px}
.big.live{background:var(--bus);color:#fff}
.big.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 8px;font:inherit;text-align:center}
.dbtn b{display:block;font-size:17px}.dbtn span{display:block;font-size:12.5px;color:var(--sub);margin-top:4px}
.sheet h3{font-size:16px}
.jh{margin:18px 0 8px;font-size:16px}
.jp{border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg);margin-right:28px}
.jp.me{background:var(--route);color:#fff;margin:0 0 8px 28px}
.jp b{font-size:11px;opacity:.75}.jp .ja{font-size:17px;font-weight:700;margin-top:2px;line-height:1.4}
.jp .ko{font-size:13px;margin-top:3px;opacity:.9}.jp .mn{font-size:13px;margin-top:2px;opacity:.75}
.sheet label{display:block;font-size:13px;color:var(--sub);margin-bottom:10px}
.sheet input,.sheet textarea,.sheet select{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:15px inherit}
.sheet button.sm,.add{background:none;color:var(--ink);border:1px solid var(--line)}
.add{display:block;width:calc(100% - 32px);margin:0 16px 10px;border-radius:12px;padding:12px;font:15px inherit;background:none;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.bus,.fill{transition:none}}

html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
header{background:var(--hd);border-bottom:3px solid var(--ol)}body::before{background:var(--hd)}
.chip{background:var(--bg);color:var(--ink);border:2px solid var(--ol);box-shadow:2px 2px 0 var(--ol);border-radius:6px;padding:6px 12px;font:600 13px inherit}
.tabs{gap:8px;margin-bottom:10px}
.tab{flex:1;background:var(--bg);color:var(--sub);border:3px solid var(--ol);box-shadow:3px 3px 0 var(--ol);border-radius:6px;padding:10px 4px;font-family:"Press Start 2P",monospace;font-size:10px}
.tab[aria-selected=true]{background:var(--route);color:#111}
.ttl{color:var(--ink);font-weight:700;font-size:14px}.tip{color:var(--sub)}
.status{background:var(--surface);border:3px solid var(--ol);border-left:6px solid var(--route);box-shadow:4px 4px 0 var(--ol);border-radius:6px}
.status span{color:var(--sub)}
.tl{margin:22px 16px 0}
.rail,.fill{left:84px;width:6px;margin-left:-3px;border-radius:0}
.rail{background:var(--line)}.fill{background:var(--route)}
.stop{grid-template-columns:54px 44px 1fr;column-gap:8px;padding-bottom:20px}
.time{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--route);padding-top:16px;text-align:right}
.dot{width:44px;height:44px;border-radius:50%;background:var(--hd);border:4px solid var(--route);display:grid;place-items:center;font-size:20px;line-height:1;z-index:1;justify-self:center}
.stop.past .dot{border-color:var(--done);opacity:.6}
.stop.past h3,.stop.past .time{color:var(--done)}
.stop.here .dot{border-color:var(--bus);box-shadow:0 0 0 4px rgba(255,90,74,.35)}
.card{background:var(--surface);border:3px solid var(--ol);box-shadow:4px 4px 0 var(--ol);border-radius:6px;padding:10px 12px}
.card h3{font-size:16px}.card p{color:var(--sub)}
.stop.here .card{outline:3px solid var(--bus)}
.leg{margin:-6px 0 18px 114px;background:transparent;border:2px dashed var(--route);color:var(--ink);border-radius:6px;padding:8px 12px;font-size:13px}
.leg i{color:var(--route)}
.sprite{display:block;width:40px;height:40px;background:var(--sheet) 0 0/160px 40px no-repeat;image-rendering:pixelated}
.sprite.il{display:inline-block;vertical-align:middle;margin:-10px 8px -8px 0}
.bus{left:84px;width:40px;height:40px;margin:-31px 0 0 -15px;background:var(--sheet) 0 0/160px 40px no-repeat;image-rendering:pixelated;box-shadow:none;font-size:0;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.bus.walk{animation:wk .6s steps(4) infinite}
@keyframes wk{from{background-position:0 0}to{background-position:-160px 0}}
.bd{background:rgba(0,0,0,.65)}
.sheet{background:var(--surface);color:var(--ink);border-top:4px solid var(--ol);border-radius:18px 18px 0 0}
.sheet .tm{color:var(--route);font-family:"Press Start 2P",monospace;font-size:10px}
.sheet h2{font-size:20px}.jh{color:var(--route)}.info b{color:var(--sub)}
.jp{background:var(--bg);border:2px solid var(--ol);border-radius:6px}
.jp.me{background:var(--route);color:#111}
.go{background:var(--route);color:#111;border:3px solid var(--ol);box-shadow:3px 3px 0 var(--ol);border-radius:6px;font-weight:800}
.go.alt{background:var(--bg);color:var(--ink)}
.sheet button{background:var(--ink);color:var(--bg);border:3px solid var(--ol);box-shadow:3px 3px 0 var(--ol);border-radius:6px;font-weight:700}
.sheet button.sm{background:var(--bg);color:var(--ink)}
.sheet input,.sheet textarea,.sheet select{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.add{background:var(--surface);color:var(--ink);border:3px solid var(--ol);box-shadow:3px 3px 0 var(--ol);border-radius:6px}
.sim{background:var(--hd);border-top:3px solid var(--ol)}
.sim button{background:var(--bg);color:var(--ink);border:2px solid var(--ol);border-radius:6px}
.hero{height:430px;border-radius:0;border-bottom:4px solid var(--ol);background:var(--herop) center 20%/cover no-repeat}
.hero::after{background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent 26%,transparent 52%,rgba(0,0,0,.8))}
.logo .lg{width:52px;height:52px;background:var(--hd);border:3px solid var(--ol);border-radius:8px;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ol)}
.logo b{font-family:"Press Start 2P",monospace;font-size:15px;letter-spacing:.08em;text-shadow:2px 2px 0 #000}
.logo small{font-family:"Press Start 2P",monospace;font-size:7px;text-shadow:1px 1px 0 #000}
.ht h1{font-size:26px;text-shadow:3px 3px 0 #000}.ht p{text-shadow:2px 2px 0 #000}
.big{border:3px solid var(--ol);box-shadow:4px 4px 0 var(--ol);border-radius:6px}
.big.live{background:var(--route);color:#111}
.big.alt,.dbtn{background:var(--surface);color:var(--ink);border:3px solid var(--ol);box-shadow:4px 4px 0 var(--ol);border-radius:6px}
.dbtn b{font-family:"Press Start 2P",monospace;font-size:11px;line-height:1.6}.dbtn span{color:var(--sub)}
.menu{gap:16px}
@media (prefers-reduced-motion:reduce){.bus.walk{animation:none}}
:root:root:root:root{--acc:#ffc400}
:root:root:root:root[data-theme="light"]{--bg:#f4efe3;--hd:#fffaf0;--surface:#ffffff;--ink:#1d1f2a;--sub:#646a7c;--line:#d9d2bf;--route:#f2b400;--acc:#9a6400;--bus:#e0402e;--done:#a9a28f;--ol:#1d1f2a;color-scheme:light}
.time,.jh,.sheet .tm,.leg i{color:var(--acc)}
.stop.past .time{color:var(--done)}
.hl{color:var(--acc);font-weight:700;text-decoration:underline}
.jpd{margin-top:14px}
.jpd summary{list-style:none;cursor:pointer;padding:12px 14px;background:var(--bg);color:var(--ink);border:3px solid var(--ol);box-shadow:3px 3px 0 var(--ol);border-radius:6px;font-weight:700}
.jpd summary::-webkit-details-marker{display:none}
.jpd summary .c,.jpd[open] summary .o{display:none}
.jpd[open] summary .c{display:inline}
.jpd .jp{margin-top:8px;position:relative}
.sheet button.spk{width:auto;margin:6px 0 0;padding:4px 10px;font-size:12px;background:var(--surface);color:var(--ink);border:2px solid var(--ol);box-shadow:2px 2px 0 var(--ol);border-radius:6px}
.jp.me .spk{background:var(--hd)}
.hero .chip{background:var(--hd);color:var(--ink)}
</style>

 $("h-days").innerHTML=DAYS.map((d,i)=>`<button class="dbtn" data-i="${i}"><b>${i+1}일차</b><span>${d.date.slice(5).replace("-","/")} (${WD[new Date(d.date+"T00:00:00").getDay()]})</span></button>`).join("");
 const t=today(),k=DAYS.findIndex(d=>d.date===t),n=Math.ceil((new Date(DAYS[0].date+"T00:00:00")-new Date(t+"T00:00:00"))/864e5);
 $("h-sub").textContent=k>=0?"오늘은 "+(k+1)+"일차 · 지금 어디쯤인지 보기":n>0?"여행 시작까지 D-"+n+" · 일정을 미리 볼 수 있어요":"여행이 끝났어요 · 일정을 다시 볼 수 있어요";
}
function showApp(i){$("home").hidden=true;$("app").hidden=false;di=i;build();scrollTo(0,0)}
function showHome(){$("app").hidden=true;$("home").hidden=false;$("bd").classList.remove("on");scrollTo(0,0)}

function openTax(){
 $("sheet").innerHTML=`<h2>💴 면세 · 택스 리펀드 안내</h2>`+TAX.map(([h,a])=>`<h3 class="jh">${h}</h3><ul>${a.map(t=>t[0]==="!"?`<li class="warn">⚠️ ${t.slice(1)}</li>`:`<li>${t}</li>`).join("")}</ul>`).join("")+`<p style="font-size:12.5px;color:var(--sub);margin-top:14px;line-height:1.5">출처: 일본 관광청 면세점 사이트 등. 제도는 바뀔 수 있으니 출국 전에 공식 사이트를 확인하세요.</p><a class="go" target="_blank" rel="noopener" href="https://www.mlit.go.jp/kankocho/tax-free/page01_000001_00028.html">🔗 일본 관광청 공식 안내</a><button id="cl">닫기</button>`;
 $("bd").classList.add("on");$("cl").onclick=()=>$("bd").classList.remove("on")}
$("h-live").onclick=()=>{const k=DAYS.findIndex(d=>d.date===today());showApp(k>=0?k:0)};
$("h-days").onclick=e=>{const b=e.target.closest(".dbtn");if(b)showApp(+b.dataset.i)};
$("h-tax").onclick=openTax;$("taxb").onclick=openTax;$("back").onclick=showHome;
build();setInterval(()=>{if(sim===null)update()},30000);
addEventListener("resize",()=>update(true));
